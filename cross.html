<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跨平台预约对比</title>
<style>
  :root{
    --bg:#0b1220; --card:#141d31; --card2:#1b2640; --line:#2b3a58;
    --tx:#eef3fb; --tx2:#a9b6cf; --accent:#3b82f6; --amber:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 500px at 15% -8%,#1b2a4a 0%,var(--bg) 55%);color:var(--tx);padding:24px 18px 80px;min-height:100vh;}
  h1{font-size:20px;font-weight:700}
  .sub{color:var(--tx2);font-size:13px;margin:6px 0 16px}
  .wrap{max-width:1280px;margin:0 auto}

  /* 视角切换 */
  .views{display:flex;gap:8px;margin-bottom:14px}
  .views button{padding:8px 18px;font-size:14px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--tx2);cursor:pointer;transition:.12s}
  .views button:hover{border-color:var(--accent);color:var(--tx)}
  .views button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* 搜索 */
  .search-wrap{position:relative;max-width:540px;margin-bottom:16px}
  .search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;transition:border .15s, box-shadow .15s}
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
  .search-box svg{flex:none}
  .search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-size:15px}
  .search-box input::placeholder{color:#6b7893}
  .search-hint{font-size:12px;color:#6b7893;flex:none}
  .search-drop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card2);border:1px solid var(--line);border-radius:14px;max-height:360px;overflow-y:auto;z-index:50;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .search-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(43,58,88,.55)}
  .search-item:last-child{border-bottom:none}
  .search-item:hover{background:rgba(59,130,246,.14)}
  .search-item .nm{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search-item .cnt{font-size:12px;color:var(--tx2);flex:none}
  .search-empty{padding:18px;text-align:center;color:var(--tx2);font-size:14px}

  .ic-fb{width:32px;height:32px;border-radius:9px;position:relative;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;flex:none;overflow:hidden}
  .ic-fb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ic-fb.big{width:38px;height:38px;font-size:17px;border-radius:10px}

  .ctrl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ctrl .lbl{font-size:13px;color:var(--tx2)}
  .ctrl select{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:7px 10px;font-size:13px;color-scheme:dark}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .gtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:18px;font-weight:700;margin-bottom:16px}
  .gtitle small{color:var(--tx2);font-weight:400;font-size:13px;margin-left:auto}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:16px}
  .pcard{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}
  .pcard.miss{opacity:.55}
  .pcard .pname{font-size:13px;color:var(--tx2);margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .pcard .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .pcard .rv{font-size:22px;font-weight:700}
  .pcard .rv small{font-size:12px;color:var(--tx2);font-weight:400;margin-left:3px}
  .pcard .meta{font-size:12px;color:var(--tx2);margin-top:8px;line-height:1.9}
  .pcard .rank{color:var(--amber);font-weight:600}
  .pcard .co{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .delta7{color:#34d399;font-size:12px;font-weight:600}
  .pcard .delta30{color:#60a5fa;font-size:12px;font-weight:600}

  .growtable{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;overflow-x:auto}
  .growtable h4{font-size:14px;color:var(--tx);font-weight:600;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--tx2);font-weight:500;cursor:pointer;user-select:none}
  th:hover{color:var(--tx)}
  th .arrow{font-size:10px;margin-left:3px}
  .up{color:#34d399}
  .down{color:#f87171}
  .flat{color:var(--tx2)}

  /* 总览 */
  .sumcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
  .sumcard{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .sumcard .k{font-size:12px;color:var(--tx2);margin-bottom:7px}
  .sumcard .v{font-size:22px;font-weight:700}
  .sumcard .v small{font-size:12px;color:var(--tx2);font-weight:400;margin-left:3px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:6px 13px;font-size:13px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--tx2);cursor:pointer}
  .chip:hover{color:var(--tx);border-color:var(--accent)}
  .chip.on{background:rgba(59,130,246,.18);border-color:var(--accent);color:#cfe0ff;font-weight:600}
  .ovwrap{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:0;overflow:auto;max-height:none}
  table.ov{min-width:980px;font-size:13px}
  table.ov th,table.ov td{padding:8px 10px;border-bottom:1px solid rgba(43,58,88,.7)}
  table.ov thead th{position:sticky;top:0;background:var(--card2);z-index:5;text-align:center;font-size:12.5px;padding:10px 8px;border-bottom:1px solid var(--line)}
  table.ov thead th:first-child{text-align:left}
  table.ov td{text-align:center;vertical-align:middle}
  table.ov td.gm{text-align:left;position:sticky;left:0;z-index:3;background:var(--card2)}
  table.ov thead th:first-child{position:sticky;left:0;z-index:6;background:var(--card2)}
  table.ov tbody tr:hover td.gm{background:#151f36}
  table.ov tbody tr:hover{background:rgba(59,130,246,.09);cursor:pointer}
  .gm-name{display:flex;align-items:center;gap:9px;max-width:230px}
  .gm-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .ov-v{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
  .ov-rk{font-size:11px;color:var(--amber);margin-top:1px}
  .ov-g{font-size:11px;margin-top:1px}
  .ov-miss{color:#4d5a75;font-size:12px}
  .nv{display:inline-block;padding:1px 7px;border-radius:7px;background:rgba(59,130,246,.16);color:#9dc0ff;font-size:11px}

  .chart-wrap{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
  .chart-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .chart-title{font-size:14px;color:var(--tx);font-weight:600}
  .chart-head .seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chart-head .seg button{padding:5px 12px;font-size:13px;border-radius:8px;background:var(--card);border:1px solid var(--line);cursor:pointer;color:var(--tx);transition:.12s}
  .chart-head .seg button:hover{border-color:var(--accent)}
  .chart-head .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chart-head .seg input{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px 8px;font-size:12px;color-scheme:dark}
  #chartSvg{width:100%;height:400px;display:block;cursor:crosshair}
  .chart-wrap.stretch{position:fixed;inset:0;z-index:900;border-radius:0;padding:18px 22px;display:flex;flex-direction:column;background:var(--bg)}
  .chart-wrap.stretch #chartSvg{flex:none;min-height:0}
  .chart-wrap.stretch .chart-head{margin-bottom:10px}
  .axis text{fill:#93a1bd;font-size:11px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--tx)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .legend b{font-weight:600}
  .crosshair{stroke:#5b6b8c;stroke-width:1;stroke-dasharray:4 4}

  .hover-tip{position:absolute;pointer-events:none;background:#0d1526;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;min-width:150px}
  .hover-tip .tt-date{color:var(--tx2);font-size:11px;margin-bottom:6px}
  .hover-tip .tt-row{display:flex;align-items:center;gap:7px;line-height:2;color:var(--tx)}
  .hover-tip .tt-row b{margin-left:auto}
  .hover-tip .tdot{width:8px;height:8px;border-radius:50%;flex:none}

  .note{margin-top:14px;font-size:12px;color:var(--tx2);line-height:1.9;border-top:1px solid var(--line);padding-top:12px}
  .note b{color:var(--amber)}
  .empty{color:var(--tx2);font-size:14px;padding:24px;text-align:center}
  .autosum{background:linear-gradient(90deg,rgba(59,130,246,.14),rgba(59,130,246,.04));border:1px solid rgba(59,130,246,.32);border-radius:12px;padding:11px 15px;font-size:13.5px;line-height:1.7;color:var(--tx);margin:0 0 14px}
  .autosum b{color:#9ec5ff}
  .barwrap{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
  .barhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--tx)}
  .barnote{font-size:11.5px;font-weight:400;color:var(--tx2);margin-left:8px}
  .barlead{font-size:12.5px;font-weight:400;color:var(--tx2)}
  .barlead b{color:var(--tx);font-variant-numeric:tabular-nums}
  .blsub{color:var(--tx2);font-size:11.5px;margin-left:4px}
  .barflex{display:grid;grid-template-columns:1fr 236px;gap:24px;align-items:stretch}
  .barmain{min-width:0;display:flex;flex-direction:column}
  /* 条形区撑满剩余高度，各行均分 —— 否则右侧饼图比左侧高，左下会空一大块 */
  .barbox{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
  .barbox>.brow{padding:0}
  .pieside{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
  .piesvg{width:186px;height:186px;display:block}
  .pie-c1{fill:var(--tx2);font-size:11px}
  .pie-c2{fill:var(--tx);font-size:17px;font-weight:700}
  .plegend{width:100%;display:flex;flex-direction:column;gap:3px}
  .pl-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx2)}
  .pl-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .pl-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl-v{font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
  .topnav{max-width:1220px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .topnav a{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--line,#2a3247);border-radius:10px;background:var(--card,#161d30);color:var(--tx2,#9aa4b2);text-decoration:none;font-size:14px;font-weight:600;transition:.12s}
  .topnav a:hover{border-color:var(--accent,#3b82f6);color:var(--tx,#e6e9f0)}
  .topnav a.active{background:var(--accent,#3b82f6);color:#fff;border-color:var(--accent,#3b82f6)}
  .barlabel{display:grid;grid-template-columns:96px 1fr 76px 48px 46px 54px;gap:10px;font-size:11px;color:var(--tx2);padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .barlabel>div:nth-child(n+3){text-align:right}
  .brow{display:grid;grid-template-columns:96px 1fr 76px 48px 46px 54px;gap:10px;align-items:center;padding:7px 0;font-size:13px}
  .brow:hover{background:rgba(59,130,246,.07);border-radius:6px}
  .bname{display:flex;align-items:center;gap:7px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bname .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .btrack{height:20px;background:rgba(255,255,255,.045);border-radius:5px;overflow:hidden}
  .bfill{height:100%;border-radius:5px;transition:width .25s}
  .bval{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .bk{text-align:right;color:var(--amber);font-variant-numeric:tabular-nums}
  .bs{text-align:right;color:var(--tx2);font-size:12px;font-variant-numeric:tabular-nums}
  .bd{text-align:right;font-size:10px;color:#fb923c}
  .barlabel>div:last-child,.brow>div:last-child{text-align:right}
  .dshort{font-size:9.5px;padding:0 5px;border-radius:4px;background:rgba(251,146,60,.18);color:#fb923c;margin-left:5px;font-weight:600;vertical-align:1px}
  .csvbtn{margin-left:auto;padding:4px 11px;font-size:12px;border-radius:7px;background:var(--card);border:1px solid var(--line);cursor:pointer;color:var(--tx2);font-weight:400}
  .csvbtn:hover{border-color:var(--accent);color:var(--tx)}
  .chip.csv{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35);color:#34d399}
  .chip.csv:hover{background:rgba(52,211,153,.2)}
  /* ---- 响应式（必须放在最后，否则被上面的基础规则覆盖）---- */
  @media(max-width:760px){
    .barflex{grid-template-columns:1fr;gap:14px}
    .pieside{flex-direction:row;justify-content:center;gap:14px;padding-top:12px}
    .piesvg{width:124px;height:124px}
    .plegend{width:auto;min-width:112px}
  }
  @media(max-width:560px){
    .barlabel{display:none}
    /* 手机改两行：第一行 平台+预约量+占比，第二行整条横杆（不再挤成一列小格）*/
    .barbox{justify-content:flex-start;gap:10px}
    .barbox>.brow{padding:0}
    .brow{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"n v s" "b b b";gap:4px 8px;padding:0;align-items:center}
    .bname{grid-area:n;font-size:12.5px}
    .bval{grid-area:v;font-size:13px}
    .bs{grid-area:s;font-size:11.5px;min-width:34px}
    .btrack{grid-area:b;height:15px;margin-top:2px}
    .brow>.bk,.brow>.bd{display:none}
    .barnote{display:none}
    .barhead{font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav"><a href="index.html?d=2026-11-27">📊 预约榜</a><a href="today.html?d=2026-11-27">🆕 Tap新游日历</a><a href="cross.html?d=2026-11-27" class="active">🔀 跨平台对比</a><a href="hb.html?d=2026-11-27">🎯 快爆精选</a></div>
  <h1>🔀 跨平台预约对比</h1>
  <div class="sub">一款游戏在 5 个平台的预约量 / 排名 / 评分 / 增长量；或看全部 <span id="subN">-</span> 款的平台横向总览</div>

  <div class="views">
    <button id="vSingle" class="on" onclick="setView('single')">🔍 单款对比</button>
    <button id="vAll" onclick="setView('all')">📋 全平台总览</button>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8b99b5" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="输入游戏名，如 无限大 / 崩坏 / 龙岛" autocomplete="off">
      <span class="search-hint" id="searchHint"></span>
    </div>
    <div class="search-drop" id="searchDrop" style="display:none"></div>
  </div>

  <div class="ctrl">
    <span class="lbl">基准日期</span>
    <select id="baseDate"></select>
    <span class="lbl" style="font-size:12px;color:#6f7d99">快照 / 排名 / 增长量都以此日为准（仅列出有数据的日子）</span>
  </div>

  <div id="panel" class="panel"></div>
</div>

<script>
const COLORS = {
  '4399游戏盒': '#22c55e',   // 绿
  '好游快爆':   '#15803d',   // 深绿
  'TapTap预约': '#7dd3fc',   // 浅蓝
  'B站游戏':    '#f472b6',   // 粉红
  '233乐园':    '#b91c1c'    // 深红
};
const ORDER = ['4399游戏盒','TapTap预约','好游快爆','B站游戏','233乐园'];
const IC_COLORS=['#3b82f6','#f87171','#fb923c','#a78bfa','#34d399','#14b8a6'];
let DATA = [], META = {};
let cur = -1, rangeDays = 30, baseDate = '', isCustom = false;
let CHART = null;
let sortKey = 'r', sortDir = -1;           // 单款表排序
let ovSort = 'TapTap预约', ovDir = -1;     // 总览按平台预约量排序
let ovFilter = 'all';
let keyword = '';
let view = 'single';
let fromDateVal = '', toDateVal = '';
let chartMode = 'abs';
let chartStretch = false;
const yAuto = true;   // 纵轴始终聚焦数据实际范围（不从 0 起）

function fmt(v){ if(v==null||v==='') return '-'; const av=Math.abs(v); if(av>=10000) return (v/10000).toFixed(av%10000===0?0:1)+'万'; return String(Math.round(v)); }
function fmtDelta(v){ if(v==null) return '-'; return (v>0?'+':'')+fmt(v); }
function fmtPct(v){ return v==null?'-':(v>0?'+':'')+v.toFixed(1)+'%'; }
function cls(v){ return v>0?'up':(v<0?'down':'flat'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function niceTicks(maxV){
  if(maxV<=0) return [0];
  const rawStep=maxV/4; const mag=Math.pow(10, Math.floor(Math.log10(rawStep))); const norm=rawStep/mag;
  let step; if(norm<=1) step=mag; else if(norm<=2) step=2*mag; else if(norm<=5) step=5*mag; else step=10*mag;
  const top=Math.ceil(maxV/step)*step; const ticks=[];
  for(let v=0; v<=top+step*0.001; v+=step) ticks.push(Math.round(v));
  return ticks;
}
function snapAt(series, date){ let best=null; for(const s of (series||[])){ if(s.d<=date) best=s; else break; } return best; }
/* 日期加减：必须走 UTC。用 new Date(s+'T00:00:00').toISOString() 在 UTC+8 会回退一天，
   导致「30日增长」实际取 31 天前的值，与曲线相对涨幅差一天对不上（2026-11-27 修）。 */
function dadd(dateStr, n){ const d=new Date(dateStr+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function gain(series, date, N){
  const c=snapAt(series,date); if(!c||c.r==null) return null;
  const cutoff=dadd(date,-N);
  let prev=null; for(const s of (series||[])){ if(s.d<=cutoff) prev=s; else break; }
  if(!prev||prev.r==null) return null; return c.r-prev.r;
}
function iconLetter(n){ return (n||'?').trim().charAt(0)||'?'; }
function iconImg(url, name, big){
  const letter=iconLetter(name), c=IC_COLORS[Math.abs((name||'').length)%IC_COLORS.length];
  const cs=big?'ic-fb big':'ic-fb';
  if(!url) return `<span class="${cs}" style="background:${c}">${esc(letter)}</span>`;
  return `<span class="${cs}" style="background:${c}">${esc(letter)}<img src="${url}" referrerpolicy="no-referrer" onerror="this.remove()"></span>`;
}

/* ================= 搜索 ================= */
const si=document.getElementById('searchInput'), sd=document.getElementById('searchDrop'), sh=document.getElementById('searchHint');
function doSearch(){
  const q=(si.value||'').trim().toLowerCase();
  keyword=q;

/* ================= 单款对比 ================= */
function buildRows(g, plats){
  let rows = plats.map(p=>{
    const pf=g.platforms[p], snap=snapAt(pf.series,baseDate);
    const g7=gain(pf.series,baseDate,7), g30=gain(pf.series,baseDate,30);
    const r = snap&&snap.r!=null?snap.r:null;
    const rk = snap?snap.rk:null;
    const r7 = (g7!=null&&r!=null)?(r-g7):null;
    const r30 = (g30!=null&&r!=null)?(r-g30):null;
    const p7 = (g7!=null&&r7!=null&&r7!==0)?(g7/r7*100):null;
    const p30 = (g30!=null&&r30!=null&&r30!==0)?(g30/r30*100):null;
    return {p, snap, r, rk, g7, g30, p7, p30};
  });
  const val = row => {
    switch(sortKey){
      case 'p': return row.p;
      case 'rk': return row.rk!=null?row.rk:Infinity;
      case 'r': return row.r!=null?row.r:-Infinity;
      case 'g7': return row.g7!=null?row.g7:-Infinity;
      case 'p7': return row.p7!=null?row.p7:-Infinity;
      case 'g30': return row.g30!=null?row.g30:-Infinity;
      case 'p30': return row.p30!=null?row.p30:-Infinity;
      default: return 0;
    }
  };
  rows.sort((a,b)=>{ const va=val(a), vb=val(b);
    if(va>vb) return sortDir; if(va<vb) return -sortDir; return 0; });
  return rows;
}

function autoSummary(g, plats){
  // 一句话结论：主战场 / 排名变化 / 增速最快 / 跨平台差距
  if(!plats.length) return '';
  const info=[];
  plats.forEach(p=>{
    const pf=g.platforms[p];
    const sn=snapAt(pf.series, baseDate);
    if(!sn||sn.r==null) return;
    // 7天前排名
    const prev=snapAt(pf.series, dadd(baseDate,-7));
    info.push({p, r:sn.r, rk:sn.rk, rkPrev:prev?prev.rk:null, score:pf.score||0});
  });
  if(!info.length) return '';
  info.sort((a,b)=>b.r-a.r);
  const total=info.reduce((a,b)=>a+b.r,0);
  const main=info[0];
  const share=total>0? main.r/total*100 : 0;

  // 排名变化（只对主战场）
  let rkTxt='';
  if(main.rk!=null && main.rkPrev!=null && main.rkPrev!==main.rk){
    const d=main.rkPrev-main.rk;   // 正=名次上升
    rkTxt=`，排名 ${d>0?'↑'+d:'↓'+Math.abs(d)}（#${main.rkPrev}→#${main.rk}）`;
  } else if(main.rk!=null){
    rkTxt=`，排名 #${main.rk}（7天未变）`;
  }

  // 区间涨幅最快
  const dFrom=dadd(baseDate,-rangeDays);
  let fastest=null;
  plats.forEach(p=>{
    const ser=(g.platforms[p].series||[]).filter(x=>x.d>=dFrom && x.d<=baseDate && x.r!=null);
    if(ser.length<2) return;
    const a=ser[0], b=ser[ser.length-1];
    if(a.r<=0) return;
    const pct=(b.r-a.r)/a.r*100;
    if(!fastest || pct>fastest.pct) fastest={p, pct, a:a.r, b:b.r};
  });

  let out=`主战场 <b>${main.p}</b>（${fmt(main.r)}，占 ${share.toFixed(0)}%）${rkTxt}`;
  if(fastest && Math.abs(fastest.pct)>=0.5){
    out+=`；近 ${rangeDays} 天 <b>${fastest.p.replace('游戏盒','').replace('预约','')}</b> 涨最快 <b class="${fastest.pct>0?'up':'down'}">${fastest.pct>0?'+':''}${fastest.pct.toFixed(1)}%</b>`;
  }
  return out;
}
/* 平台对比直方图：横向条形 + 数值/排名/7日增幅，顶部一排汇总 */
function renderBars(g, plats){
  const rows = plats.map(p=>{
    const pf=g.platforms[p];
    const sn=snapAt(pf.series, baseDate);
    if(!sn||sn.r==null) return {p, r:0, rk:null, g7:null, p7:null, days:pf.days||0, has:false};
    return {p, r:sn.r, rk:sn.rk, days:pf.days||0, has:true, score:pf.score};
  }).filter(x=>x.has);
  if(!rows.length) return '';
  rows.sort((a,b)=>b.r-a.r);
  const max = Math.max(...rows.map(x=>x.r)) || 1;
  const total = rows.reduce((a,b)=>a+b.r,0);
  const leader = rows[0];

  let bars='';
  rows.forEach((x,i)=>{
    const w = Math.max(1.2, x.r/max*100);
    const share = total>0 ? x.r/total*100 : 0;
    const short = (x.days<3);
    bars += `<div class="brow" title="${x.p} ${fmt(x.r)}｜排名 #${x.rk??'-'}｜占 ${share.toFixed(0)}%">
      <div class="bname"><span class="dot" style="background:${COLORS[x.p]}"></span>${x.p.replace('游戏盒','').replace('预约','')}</div>
      <div class="btrack"><div class="bfill" style="width:${w}%;background:${COLORS[x.p]}"></div></div>
      <div class="bval">${fmt(x.r)}</div>
      <div class="bk">#${x.rk??'-'}</div>
      <div class="bs">${share.toFixed(0)}%</div>
      ${short?`<div class="bd">仅${x.days}天</div>`:''}
    </div>`;
  });

  // ---- 饼图（占比）----
  const R=76, CX=100, CY=100, HOLE=0.56;
  let ang=-Math.PI/2, slices='';
  rows.forEach(x=>{
    const frac = total>0 ? x.r/total : 0;
    const sweep = frac*Math.PI*2;
    if(sweep <= 0.0001) return;
    const a0=ang, a1=ang+sweep;
    const x0=CX+R*Math.cos(a0), y0=CY+R*Math.sin(a0);
    const x1=CX+R*Math.cos(a1), y1=CY+R*Math.sin(a1);
    const large = sweep>Math.PI ? 1 : 0;
    const ri = R*HOLE;
    const xi1=CX+ri*Math.cos(a1), yi1=CY+ri*Math.sin(a1);
    const xi0=CX+ri*Math.cos(a0), yi0=CY+ri*Math.sin(a0);
    slices += `<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L ${xi1.toFixed(2)} ${yi1.toFixed(2)} A ${ri} ${ri} 0 ${large} 0 ${xi0.toFixed(2)} ${yi0.toFixed(2)} Z" fill="${COLORS[x.p]}" stroke="var(--card2)" stroke-width="1.2"><title>${x.p} ${fmt(x.r)} · ${(frac*100).toFixed(1)}%</title></path>`;
    ang=a1;
  });
  const pieLegend = rows.map(x=>{
    const sh = total>0 ? x.r/total*100 : 0;
    return `<div class="pl-row"><span class="dot" style="background:${COLORS[x.p]}"></span><span class="pl-n">${x.p.replace('游戏盒','').replace('预约','')}</span><span class="pl-v">${sh.toFixed(0)}%</span></div>`;
  }).join('');
  const pie = `<div class="pieside">
    <svg viewBox="0 0 200 200" class="piesvg">${slices}
      <text x="${CX}" y="${CY-11}" text-anchor="middle" class="pie-c1">总预约</text>
      <text x="${CX}" y="${CY+17}" text-anchor="middle" class="pie-c2">${fmt(total)}</text>
    </svg>
    <div class="plegend">${pieLegend}</div>
  </div>`;

  return `<div class="barwrap">
    <div class="barhead">
      <span>各平台预约量对比<span class="barnote">条形 = 相对最大值的比例</span></span>
      <span class="barlead">大盘总数 <b>${fmt(total)}</b><span class="blsub">（${rows.length} 个平台合计）</span></span>
    </div>
    <div class="barflex">
      <div class="barmain">
        <div class="barlabel"><div></div><div></div><div>预约量</div><div>排名</div><div>占比</div><div></div></div>
        <div class="barbox">${bars}</div>
      </div>
      ${pie}
    </div>
  </div>`;
}

/* ================= 全平台总览 ================= */
function ovCell(g, p, maxByPlat){
  const pf=g.platforms[p];
  if(!pf) return `<td class="ov-miss">未收录</td>`;
  const s=snapAt(pf.series, baseDate);
  if(!s||s.r==null) return `<td class="ov-miss">无数据</td>`;
  const g7=gain(pf.series, baseDate, 7);
  const mx=maxByPlat[p]||1;
  const a=0.05+0.30*Math.min(1, Math.sqrt((s.r||0)/mx));
  return `<td style="background:rgba(59,130,246,${a.toFixed(3)})">
    <div class="ov-v">${fmt(s.r)}</div>
    <div class="ov-rk">#${s.rk??'-'}</div>
    ${g7!=null?`<div class="ov-g ${cls(g7)}">${fmtDelta(g7)}</div>`:'<div class="ov-g flat">-</div>'}
  </td>`;
}

function ovRows(){
  let list = DATA.slice();
  const q=keyword;
  if(q) list=list.filter(g=>g.name.toLowerCase().includes(q));
  if(ovFilter==='five') list=list.filter(g=>ORDER.every(p=>snapAt((g.platforms[p]||{}).series||[],baseDate)!=null));
  if(ovFilter==='4399') list=list.filter(g=>snapAt((g.platforms['4399游戏盒']||{}).series||[],baseDate)!=null);
  if(ovFilter==='no4399') list=list.filter(g=>snapAt((g.platforms['4399游戏盒']||{}).series||[],baseDate)==null);
  const valOf=(g)=>{
    if(ovSort==='n') return ORDER.filter(p=>g.platforms[p]).length;
    if(ovSort==='name') return g.name;
    const s=snapAt((g.platforms[ovSort]||{}).series||[],baseDate);
    return s&&s.r!=null? s.r : -Infinity;
  };
  list.sort((a,b)=>{
    const va=valOf(a), vb=valOf(b);
    if(ovSort==='name') return (va<vb?-1:va>vb?1:0)*(ovDir>0?1:-1);
    if(va>vb) return ovDir; if(va<vb) return -ovDir; return 0;
  });
  return list;
}

/* ================= 导出 CSV ================= */
function csvEsc(v){
  const s=String(v==null?'':v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(name, rows){
  const csv='\ufeff'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportOverview(){
  const out=[['游戏','平台数',...ORDER.flatMap(p=>[p+'预约',p+'排名'])]];
  DATA.forEach(g=>{
    const ps=ORDER.filter(p=>g.platforms[p]);
    out.push([g.name, ps.length, ...ORDER.flatMap(p=>{
      const pf=g.platforms[p]; if(!pf) return ['',''];
      const sn=snapAt(pf.series,baseDate);
      return sn? [Math.round(sn.r), sn.rk??''] : ['',''];
    })]);
  });
  downloadCsv(`全平台总览_${baseDate}.csv`, out);
}
function exportSingle(){
  if(cur<0) return;
  const g=DATA[cur];
  const plats=ORDER.filter(p=>g.platforms[p]);
  const rows=buildRows(g,plats);
  const out=[['游戏','平台','排名','当前预约','7日增长','7日增幅%','30日增长','30日增幅%','评分','厂商']];
  rows.forEach(r=>{
    const pf=g.platforms[r.p];
    out.push([g.name, r.p, r.rk??'', r.r!=null?Math.round(r.r):'', r.g7!=null?Math.round(r.g7):'',
      r.p7!=null?r.p7.toFixed(2):'', r.g30!=null?Math.round(r.g30):'', r.p30!=null?r.p30.toFixed(2):'',
      pf.score||'', pf.company||'']);
  });
  downloadCsv(`${g.name}_跨平台对比_${baseDate}.csv`, out);
}

function renderChart(g, plats){
  const to=baseDate; const from=dadd(baseDate,-rangeDays);
  const _st=chartStretch;
  const _host=document.querySelector('.chart-wrap');
  const _cw=_host? (_host.clientWidth||window.innerWidth) : window.innerWidth;
  const W=_st? Math.max(680, _cw-36) : Math.max(300, _cw-28);
  const _narrow=W<520;
  const H=_st? Math.max(420, window.innerHeight-170) : (_narrow?300:400);
  const PL=_narrow?44:64, PR=_narrow?44:20, PT=18, PB=30;
  if(chartMode==='grid') return renderChartGrid(g, plats, from, to, W, H);
  const PCT=chartMode==='pct';
  // 每个平台在此区间内的 map
  const maps={};
  plats.forEach(p=>{ const map={}; (g.platforms[p].series||[]).forEach(s=>{ if(s.d>=from&&s.d<=to&&s.r!=null) map[s.d]=s.r; }); maps[p]=map; });
  const dates=[...new Set(Object.values(maps).flatMap(m=>Object.keys(m)))].sort();
  if(!dates.length) return '<div style="color:var(--tx2);font-size:13px;padding:12px">该范围内无数据</div>';
  // 换算：绝对值 or 相对涨幅（区间内每平台首个有值日 = 0%）
  const conv={};
  plats.forEach(p=>{
    const m=maps[p]; const ds=Object.keys(m).sort();
    const b=ds.length? m[ds[0]] : 0;
    const o={};
    ds.forEach(d=>{ o[d] = PCT ? (b>0 ? (m[d]-b)/b*100 : null) : m[d]; });
    conv[p]=o;
  });
  const allV=Object.values(conv).flatMap(o=>Object.values(o)).filter(v=>v!=null);
  const maxA=Math.max(...allV), minA=Math.min(...allV);
  let ticks, lo, hi;
  if(PCT){
    ticks = niceTicksPct(Math.min(minA,0), maxA);
    lo = ticks[0]; hi = ticks[ticks.length-1];
  } else if(yAuto){
    ticks = niceTicksRange(minA, maxA);
    lo = ticks[0]; hi = ticks[ticks.length-1];
  } else {
    ticks = niceTicks(maxA);
    lo = 0; hi = ticks[ticks.length-1];
  }
  const X=i=> PL+(W-PL-PR)*(dates.length>1? i/(dates.length-1):0);
  const Y=v=> PT+(H-PT-PB)*(1-(v-lo)/(hi-lo||1));
  let g1='';
  ticks.forEach(vv=>{ const yy=Y(vv); const zero=Math.abs(vv)<1e-9;
    g1+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--line)" stroke-width="${zero&&PCT?1.5:1}" stroke-dasharray="${zero&&PCT?'none':'3 3'}"/>`;
    g1+=`<text x="${PL-10}" y="${yy+4}" text-anchor="end" class="axis">${PCT? (vv>0?'+':'')+vv.toFixed(0)+'%' : fmt(vv)}</text>`; });
  const step=Math.max(1,Math.floor(dates.length/8));
  dates.forEach((d,i)=>{ if(i%step===0||i===dates.length-1){ g1+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" class="axis">${d.slice(5)}</text>`; }});
  let paths='', dots='';
  CHART={dates, series:maps, conv, PL, PR, W, X, Y, PCT};
  const lastVals={}, lastPct={};
  plats.forEach(p=>{
    const map=maps[p], co=conv[p];
    const coords=dates.map((d,i)=> (d in map && co[d]!=null) ? {i,d,x:X(i),y:Y(co[d]),v:map[d],pv:co[d]} : null).filter(c=>c);
    if(coords.length<2) return;
    paths+=`<polyline points="${coords.map(c=>c.x+','+c.y).join(' ')}" fill="none" stroke="${COLORS[p]}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>`;
    const cl=coords[coords.length-1];
    coords.forEach(c=>{ dots+=`<circle cx="${c.x}" cy="${c.y}" r="2.6" fill="${COLORS[p]}" stroke="var(--card2)" stroke-width="1"><title>${p} ${c.d} ${fmt(c.v)}${PCT?' ('+(c.pv>0?'+':'')+c.pv.toFixed(1)+'%)':''}</title></circle>`; });
    dots+=`<circle cx="${cl.x}" cy="${cl.y}" r="4.5" fill="${COLORS[p]}" stroke="var(--card2)" stroke-width="1.5"/>`;
    lastVals[p]=cl.v; lastPct[p]=cl.pv;
  });
  const legend=plats.map(p=>`<span><span class="dot" style="background:${COLORS[p]}"></span>${p} <b>${fmt(lastVals[p])}</b>${PCT&&lastPct[p]!=null?` <i style="font-style:normal;color:${lastPct[p]>=0?'#34d399':'#f87171'}">${lastPct[p]>0?'+':''}${lastPct[p].toFixed(1)}%</i>`:''}</span>`).join('');
  return `<svg id="chartSvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    <g class="axis">${g1}</g>
    ${paths}${dots}
    <line id="crosshair" class="crosshair" y1="${PT}" y2="${H-PB}" style="display:none"/>
    <rect x="${PL}" y="${PT}" width="${W-PL-PR}" height="${H-PT-PB}" fill="transparent"/>
  </svg>
  <div class="legend">${legend}</div>
  <div class="hover-tip" id="hoverTip"></div>`;
}
function renderChartGrid(g, plats, from, to, W, H){
  // 每个平台一条独立纵轴的小图，纵向堆叠；共用日期横轴
  const maps={};
  plats.forEach(p=>{ const m={}; (g.platforms[p].series||[]).forEach(s=>{ if(s.d>=from&&s.d<=to&&s.r!=null) m[s.d]=s.r; }); maps[p]=m; });
  const dates=[...new Set(Object.values(maps).flatMap(m=>Object.keys(m)))].sort();
  if(!dates.length) return '<div style="color:var(--tx2);font-size:13px;padding:12px">该范围内无数据</div>';
  const _narrow = W<520;
  const PL=_narrow?46:78, PR=_narrow?52:74, PT=8, PB=28;
  const rowH=Math.max(_narrow?52:62, Math.round((H-30-PB) / plats.length) - 8);
  const gap=8;
  const totalH = PT + plats.length*(rowH+gap) + PB;
  const X=i=> PL+(W-PL-PR)*(dates.length>1? i/(dates.length-1):0);
  let body='';
  const dateLabels = (()=>{ let o=''; const _maxLab=_narrow?4:10; const step=Math.max(1,Math.ceil(dates.length/_maxLab));
    dates.forEach((d,i)=>{ if(i%step===0||i===dates.length-1) o+=`<text x="${X(i)}" y="${totalH-10}" text-anchor="middle" class="axis">${d.slice(5)}</text>`; });
    return o; })();
  plats.forEach((p,pi)=>{
    const m=maps[p]; const ds=Object.keys(m).sort();
    const y0=PT+pi*(rowH+gap);
    if(!ds.length){ body+=`<g><text x="8" y="${y0+rowH/2+4}" class="axis">${p}</text><text x="${PL+8}" y="${y0+rowH/2+4}" class="axis">无数据</text></g>`; return; }
    const vals=ds.map(d=>m[d]);
    const vmin=Math.min(...vals), vmax=Math.max(...vals);
    const pad=(vmax-vmin)*0.14 || Math.max(1, vmax*0.02);
    const lo=vmin-pad, hi=vmax+pad;
    const Y=v=> y0 + rowH*(1-(v-lo)/(hi-lo||1));
    const first=vals[0], last=vals[vals.length-1];
    const pct= first>0 ? (last-first)/first*100 : 0;
    const upn = pct>=0;
    // 基线 + 首末参考
    body+=`<g>`;
    body+=`<rect x="${PL}" y="${y0}" width="${W-PL-PR}" height="${rowH}" fill="rgba(255,255,255,.016)" rx="6"/>`;
    body+=`<line x1="${PL}" y1="${Y(first)}" x2="${W-PR}" y2="${Y(first)}" stroke="rgba(147,161,189,.35)" stroke-width="1" stroke-dasharray="2 3"/>`;
    const coords=dates.map((d,i)=> d in m ? {x:X(i),y:Y(m[d]),v:m[d],d} : null).filter(Boolean);
    if(coords.length>1){
      body+=`<polyline points="${coords.map(c=>c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ')}" fill="none" stroke="${COLORS[p]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    coords.forEach(c=>{ body+=`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="6" fill="transparent"><title>${p} ${c.d} ${fmt(c.v)}</title></circle>`; });
    const cl=coords[coords.length-1];
    body+=`<circle cx="${cl.x.toFixed(1)}" cy="${cl.y.toFixed(1)}" r="3.6" fill="${COLORS[p]}" stroke="var(--card2)" stroke-width="1.4"/>`;
    // 左侧平台名 + 最高最低
    const _pn = _narrow? p.replace('游戏盒','').replace('预约','').slice(0,4) : p.replace('游戏盒','').replace('预约','');
    body+=`<text x="6" y="${y0+rowH/2-3}" class="axis" style="fill:${COLORS[p]};font-weight:600;font-size:${_narrow?10:11.5}px">${_pn}</text>`;
    if(!_narrow) body+=`<text x="8" y="${y0+rowH/2+12}" class="axis" style="font-size:10px">${fmt(vmin)}~${fmt(vmax)}</text>`;
    // 右侧末值 + 涨幅
    body+=`<text x="${W-PR+6}" y="${y0+rowH/2-2}" class="axis" style="fill:var(--tx);font-weight:700;font-size:${_narrow?10.5:12}px">${fmt(last)}</text>`;
    body+=`<text x="${W-PR+6}" y="${y0+rowH/2+12}" class="axis" style="fill:${upn?'#34d399':'#f87171'};font-size:${_narrow?9.5:10.5}px">${upn?'+':''}${pct.toFixed(1)}%</text>`;
    body+=`</g>`;
  });
  CHART=null;
  return `<svg id="chartSvg" viewBox="0 0 ${W} ${totalH}" preserveAspectRatio="none" style="height:${totalH}px">
    <g class="axis">${dateLabels}</g>
    ${body}
  </svg>
  <div class="legend" style="color:var(--tx2);font-size:12px">每个平台一条独立纵轴（左侧为区间最低~最高），所以小体量平台的小幅增长也能看清；右侧为该平台最新值和区间涨幅。</div>`;
}
function niceTicksRange(minV, maxV){
  // 自适应纵轴：只覆盖数据实际范围（上下各留 6% 余量），但不往 0 以下延伸
  if(maxV<=minV) maxV=minV+1;
  const pad=(maxV-minV)*0.06;
  let lo0=minV-pad, hi0=maxV+pad;
  if(minV>=0 && lo0<0) lo0=Math.max(0, minV*0.6);
  const rawStep=(hi0-lo0)/4; const mag=Math.pow(10, Math.floor(Math.log10(rawStep))); const norm=rawStep/mag;
  let step; if(norm<=1) step=mag; else if(norm<=2) step=2*mag; else if(norm<=5) step=5*mag; else step=10*mag;
  const lo=Math.floor(lo0/step)*step, hi=Math.ceil(hi0/step)*step, out=[];
  for(let v=lo; v<=hi+step*0.001; v+=step) out.push(Math.round(v));
  return out;
}
function niceTicksPct(minV, maxV){
  if(!isFinite(maxV)) return [0];
  const span=Math.max(maxV-minV, 1);
  const rawStep=span/5; const mag=Math.pow(10, Math.floor(Math.log10(rawStep))); const norm=rawStep/mag;
  let step; if(norm<=1) step=mag; else if(norm<=2) step=2*mag; else if(norm<=5) step=5*mag; else step=10*mag;
  const lo=Math.floor(minV/step)*step, hi=Math.ceil(maxV/step)*step, ticks=[];
  for(let v=lo; v<=hi+step*0.001; v+=step) ticks.push(Math.round(v*100)/100);
  if(!ticks.includes(0)) ticks.push(0), ticks.sort((a,b)=>a-b);
  return ticks;
}
function bindChartHover(){
  const svg=document.getElementById('chartSvg'), tip=document.getElementById('hoverTip'), cross=document.getElementById('crosshair');
  if(!svg||!tip||!CHART) return;
  svg.addEventListener('mousemove', e=>{
    const r=svg.getBoundingClientRect();
    const sx=(e.clientX-r.left)/r.width*CHART.W;
    const {dates,PL,PR,W}=CHART;
    if(dates.length<2) return;
    let idx=Math.round((sx-PL)/((W-PL-PR)/(dates.length-1)));
    if(idx<0||idx>=dates.length) return;
    const d=dates[idx], x=CHART.X(idx);
    cross.setAttribute('x1',x); cross.setAttribute('x2',x); cross.style.display='block';
    let rows=ORDER.filter(p=>CHART.series[p] && CHART.series[p][d]!=null).map(p=>{ const pv=CHART.conv[p]?CHART.conv[p][d]:null; return `<div class="tt-row"><span class="tdot" style="background:${COLORS[p]}"></span>${p}<b>${fmt(CHART.series[p][d])}</b>${CHART.PCT&&pv!=null?`<i style="font-style:normal;color:${pv>=0?'#34d399':'#f87171'};margin-left:6px">${pv>0?'+':''}${pv.toFixed(1)}%</i>`:''}</div>`; }).join('');
    tip.innerHTML=`<div class="tt-date">${d}</div>${rows}`;
    tip.style.display='block';
    tip.style.left=Math.min(e.clientX-r.left+14, r.width-160)+'px';
    tip.style.top=(e.clientY-r.top-12)+'px';
  });
  svg.addEventListener('mouseleave', ()=>{ cross.style.display='none'; tip.style.display='none'; });
}
