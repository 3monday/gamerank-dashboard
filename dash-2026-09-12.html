<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏预约榜看板 · 2026-09-12</title>
<style>
  :root {
    --bg:#0f1420; --bg2:#1c2333; --bg3:#243049; --head:#151b2a;
    --card:#161d30; --card2-hover:#161d30; --inset:#13203a;
    --line:#2a3247; --line2:#232b40; --line3:#22304e; --line4:#1e2638;
    --tx:#e6e9f0; --tx2:#dfe3ee; --tx3:#8b93a7; --tx4:#6b7280; --tx5:#7a8499;
    --title:#ffffff;
    --accent:#3b82f6; --accent-hi:#2563eb; --link:#7aa2ff;
    --pos:#22c55e; --neg:#ef4444; --zero:#64748b; --na:#475569;
    --warn:#f59e0b; --warn-txt:#fbbf24; --onamber:#1a1205;
    --bc-bg:#2b3a5c;
  }
  /* ================= 暖纸米白 · 浅色素雅 (明亮) ================= */
  body.theme-paper {  /* 暖纸 · 米白浅色 */
    background:var(--bg); color:var(--tx);
    --bg:#f4f1ea; --bg2:#ffffff; --bg3:#efece3; --head:#eae6dc;
    --card:#ffffff; --card2-hover:#f2eee4; --inset:#faf7ef;
    --line:#e0dacb; --line2:#eae4d7; --line3:#e6dfd0; --line4:#efeadf;
    --tx:#33332d; --tx2:#494943; --tx3:#7f786a; --tx4:#a09a8b; --tx5:#8f887a;
    --title:#2a2a23;
    --accent:#5b7f9e; --accent-hi:#49708f; --link:#3d6492;
    --pos:#35855b; --neg:#c05040; --zero:#a49e91; --na:#b8b2a5;
    --warn:#b8842a; --warn-txt:#a8751c; --onamber:#fffdf6;
    --bc-bg:#d5cfc1;
  }
  /* ================= 霓虹石墨 · 高对比近黑 (科技) ================= */
  body.theme-graphite {  /* 石墨 · 黑+荧光青 */
    background:var(--bg); color:var(--tx);
    --bg:#0b0d10; --bg2:#131619; --bg3:#1d2126; --head:#0f1215;
    --card:#15181c; --card2-hover:#20252c; --inset:#101317;
    --line:#24282e; --line2:#1c2024; --line3:#252a31; --line4:#191c20;
    --tx:#e6edf2; --tx2:#c2cad2; --tx3:#88929b; --tx4:#626a73; --tx5:#778089;
    --title:#f7fbfe;
    --accent:#2fd4c0; --accent-hi:#5ce6d2; --link:#4fd8c6;
    --pos:#3dd68a; --neg:#ff5d6c; --zero:#4a5159; --na:#343b41;
    --warn:#f2c14e; --warn-txt:#ffd566; --onamber:#241d08;
    --bc-bg:#1d3a3a;
  }

  /* 各主题下 .bc(厂商小徽标)文本色微调(主要兼容浅色纸面) */
  body.theme-paper .bc { color:#3b3b35; }
  body.theme-graphite .bc { color:#bfe9e2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--tx); padding:18px;
  }
  .masthead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:4px 0 2px; }
  .mh-title { font-size:17px; font-weight:700; color:var(--title); }
  .mh-sub { color:var(--tx3); font-size:12px; }
  .hint { color:var(--tx4); font-size:11px; margin:0 0 12px; }
  /* 帮助按钮：醒目可点的文字入口（点开才出现榜单用法说明） */
  .hbtn { display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-size:12.5px; font-weight:600;
     color:var(--accent); background:var(--bg2); border:1.5px solid var(--accent); border-radius:16px;
     padding:4px 12px; margin-left:6px; user-select:none; transition:background .15s, color .15s, filter .1s; vertical-align:middle; }
  .hbtn:hover { background:var(--accent); color:#fff; }
  .hbtn.on { background:var(--accent); color:#fff; }
  .hbtn.on:hover { filter:brightness(1.08); }
  .hbtn .mark { font-size:12px; }
  .hpop { display:none; margin:0 0 10px; padding:8px 12px; border-left:3px solid var(--accent);
     background:var(--bg2); border-radius:6px; color:var(--tx3); font-size:12px; line-height:1.9; }
  .hpop.show { display:block; }
  .hpop b { color:var(--tx2); font-weight:600; }
  /* 轻量首次提示条(不遮数据, 一次性) */
  .tipbar { display:flex; flex-wrap:wrap; align-items:center; gap:5px 14px; margin:6px 0 10px; padding:8px 12px;
     background:color-mix(in srgb, var(--accent) 9%, transparent); border:1px solid color-mix(in srgb, var(--accent) 38%, transparent);
     border-radius:8px; color:var(--tx2); font-size:12.5px; line-height:1.6; }
  .tipbar b { color:var(--title); }
  .tipbar .hi { color:var(--accent); font-weight:800; }
  .tip-x { margin-left:auto; cursor:pointer; color:var(--tx4); font-weight:700; padding:0 4px; flex:none; }
  .tip-x:hover { color:var(--accent); }
  th.sortable:hover { color:var(--tx); }
  /* 主题切换：做成右下悬浮圆钮(同回顶钮), 菜单向上弹 */
  .theme-switch { position:fixed; right:24px; bottom:82px; z-index:110; width:44px; height:44px; border-radius:50%;
     background:var(--bg2); color:var(--tx2); border:1px solid var(--line); cursor:pointer;
     display:inline-flex; align-items:center; justify-content:center; font-size:20px; user-select:none;
     box-shadow:0 3px 12px rgba(0,0,0,.15); }
  .theme-switch:hover { background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .theme-switch .tn { position:absolute; right:52px; top:50%; transform:translateY(-50%); white-space:nowrap;
     font-size:11px; color:var(--tx4); background:var(--card); border:1px solid var(--line); border-radius:6px;
     padding:1px 6px; opacity:0; pointer-events:none; transition:opacity .12s; }
  .theme-switch:hover .tn { opacity:1; }
  .theme-menu { position:absolute; bottom:calc(100% + 10px); right:0; z-index:120; min-width:150px;
     background:var(--card); border:1px solid var(--line); border-radius:10px; padding:4px; box-shadow:0 -8px 24px rgba(0,0,0,.2);
     display:none; flex-direction:column; }
  .theme-menu.open { display:flex; }
  .theme-menu .tm-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:7px;
     color:var(--tx); cursor:pointer; font-size:12.5px; }
  .theme-menu .tm-item:hover { background:var(--bg3); }
  .theme-menu .tm-item.sel { color:var(--accent); font-weight:600; }
  .theme-menu .dot { width:12px; height:12px; border-radius:50%; border:1px solid var(--line); flex:0 0 auto; }
  body { transition:background .25s ease, color .25s ease; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tab { padding:7px 16px; border-radius:8px; background:var(--bg2); cursor:pointer;
          font-size:13px; color:var(--tx2); border:1px solid var(--line); }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  .search { padding:6px 10px; border-radius:8px; background:var(--bg2); color:var(--tx);
             border:1px solid var(--line); font-size:13px; width:220px; }
  .search::placeholder { color:var(--tx4); }
  .new-btn { padding:6px 14px; border-radius:8px; background:var(--bg2); color:var(--tx2);
               border:1px solid var(--line); cursor:pointer; font-size:12px; }
  .new-btn.on { background:var(--warn); color:var(--onamber); border-color:var(--warn); font-weight:600; }
  .tagbar { display:flex; flex-direction:column; align-items:stretch; gap:8px; margin-bottom:10px; }
  /* ==== 厂商屏蔽(排除) ==== */
  .blockbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:2px 0 8px; }
  .block-add { display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-size:12.5px; color:#fff;
     background:var(--neg,#e5484d); border:0; border-radius:16px; padding:5px 13px; font-weight:600; user-select:none;
     transition:filter .12s; }
  .block-add:hover { filter:brightness(1.1); }
  .block-sw { cursor:pointer; color:var(--tx3); font-size:12px; text-decoration:underline dotted; user-select:none; }
  .block-sw:hover { color:var(--neg,#e5484d); }
  .blocklist { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 8px; margin:2px 0 8px;
     background:color-mix(in srgb, var(--neg,#e5484d) 8%, transparent); border:1px dashed color-mix(in srgb, var(--neg,#e5484d) 45%, transparent); border-radius:8px; }
  .blocklist .blk-tip { font-size:12px; color:var(--tx3); margin-right:2px; }
  .blk { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:14px; font-size:12px;
     background:color-mix(in srgb, var(--neg,#e5484d) 18%, var(--card)); color:var(--neg,#ff6b6b); border:1px solid color-mix(in srgb, var(--neg,#e5484d) 45%, transparent); font-weight:600; }
  .blk .b-x { cursor:pointer; font-weight:800; opacity:.75; margin-left:2px; }
  .blk .b-x:hover { opacity:1; }
  .tag { display:inline-flex; align-items:center; gap:5px; padding:4px 8px 4px 12px;
          border-radius:16px; cursor:pointer; font-size:12px; position:relative; user-select:none;
          background:color-mix(in srgb, var(--accent) 10%, var(--card));
          color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); }
  /* 屏蔽厂商(红标签) */
  .tag-block { background:color-mix(in srgb, var(--neg,#e5484d) 13%, var(--card)); color:var(--neg,#e5484d);
     border:1px solid color-mix(in srgb, var(--neg,#e5484d) 62%, transparent); font-weight:600; }
  .tag-block .bx { display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px;
     border-radius:50%; font-size:11px; color:#fff; background:var(--neg,#e5484d); cursor:pointer; margin-left:3px; }
  .tag-block .bx:hover { background:var(--neg,#e5484d); color:#fff; }
  .tb-sep { width:1px; height:22px; background:var(--line3); margin:0 2px; align-self:center; }
  .tag-add.tag-add-block { color:#fff; background:color-mix(in srgb, var(--neg,#e5484d) 78%, transparent); border:1px solid var(--neg,#e5484d); border-style:dashed; }
  .tag-add.tag-add-block:hover { background:color-mix(in srgb, var(--neg,#e5484d) 95%, transparent); color:#fff; }
  .tag.on { background:var(--accent); color:#fff; border-color:var(--accent-hi); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
  .tag .x { display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px;
             border-radius:50%; font-size:11px; line-height:1; color:var(--tx3); cursor:pointer; }
  .tag .x:hover { background:var(--neg); color:#fff; }
  .tag-add { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
              border-radius:50%; color:var(--accent); border:1px solid var(--accent); border-style:dashed;
              background:color-mix(in srgb, var(--accent) 15%, var(--card)); cursor:pointer; font-size:18px; line-height:1; }
  .tag-add:hover { background:var(--accent); color:#fff; }
  .tag-custom { border-style:dashed; border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); color:var(--accent); }
  .tag-custom.on { background:var(--accent); color:#fff; border-color:var(--accent-hi); }
  /* 厂商标签栏：筛选(主题强调色) / 屏蔽(主题报错红) 两个分组容器 */
  .tgrp { display:inline-flex; flex-wrap:wrap; gap:6px; align-items:center; padding:5px 9px;
     border:1px solid color-mix(in srgb, var(--accent) 38%, var(--line2)); border-radius:11px;
     background:color-mix(in srgb, var(--accent) 9%, transparent); }
  .tgrp-l { font-size:11px; font-weight:800; color:var(--accent); letter-spacing:.3px; margin-right:2px; white-space:nowrap; }
  .tgrp-red { background:color-mix(in srgb, var(--neg,#e5484d) 8%, transparent); border-color:color-mix(in srgb, var(--neg,#e5484d) 35%, var(--line2)); }
  .tgrp-red .tgrp-l { color:color-mix(in srgb, var(--neg,#ff6b6b) 75%, var(--tx4)); }
  .meta { color:var(--tx3); font-size:12px; margin-bottom:10px; }
  .wrap { overflow-x:auto; overflow-y:auto; height:min(88vh, 1725px); min-height:520px;
     border-radius:8px; border:1px solid var(--line2); scroll-behavior:smooth; scrollbar-width:thin;
     scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) color-mix(in srgb, var(--tx4) 14%, transparent); }
  .wrap::-webkit-scrollbar { width:10px; height:10px; }
  .wrap::-webkit-scrollbar-track { background:color-mix(in srgb, var(--tx4) 12%, transparent); border-radius:8px; }
  .wrap::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 55%, transparent); border-radius:8px; }
  .wrap::-webkit-scrollbar-thumb:hover { background:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:900px; }
  th,td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--line2); white-space:nowrap; }
  th { color:var(--tx3); font-weight:600; font-size:12px; background:var(--head); position:sticky; top:0; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  th.sortable:hover { color:var(--tx); }
  th.sorted { color:var(--accent); }
  tr:hover { background:var(--card2-hover, var(--card)); }
  .pos { color:var(--pos); } .neg { color:var(--neg); } .zero { color:var(--zero); } .na { color:var(--na); }
  .link { color:var(--link); text-decoration:none; margin-left:6px; font-size:12px; }
  .link:hover { text-decoration:underline; }
  .empty { color:var(--tx3); padding:30px; text-align:center; }
  .badge-c { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px;
              background:var(--badge-bg, var(--line)); color:var(--badge-tx, var(--tx2)); margin-left:4px; }
  .new-badge { display:inline-block; padding:0 6px; border-radius:6px; font-size:11px;
                 background:var(--warn); color:var(--onamber); margin-right:5px; font-weight:600; }
  .co-sub { color:var(--tx4, #8b93a7); font-size:11px; margin-top:2px; line-height:1.35; }
  .note { color:var(--tx4); font-size:12px; margin-top:12px; }
  .backtop { position:fixed; right:24px; bottom:24px; width:44px; height:44px; border-radius:50%;
              background:var(--accent); color:#fff; border:none; font-size:22px; cursor:pointer;
              box-shadow:0 4px 14px rgba(0,0,0,.3); display:none; align-items:center; justify-content:center;
              z-index:99; transition:opacity .2s, transform .2s; }
  .backtop:hover { background:var(--accent-hi); transform:translateY(-2px); }
  .brief { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  .brief .span2 { grid-column:span 2; }
  .brief .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; grid-column:1/-1; }
  @media (max-width:900px) { .brief { grid-template-columns:1fr; } .brief .row2 { grid-template-columns:1fr; } }
  .brief > * { min-width:0; }
  .leader-card { grid-column:1/-1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
  .leader-card .leader-block, .leader-card .lb-t, .leader-card .lc { min-width:0; max-width:100%; }
  .leader-body { overflow-wrap:anywhere; display:flex; flex-direction:column; gap:12px; font-size:13px; color:var(--tx); }
  .leader-h { font-size:15px; font-weight:700; color:var(--title); display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .leader-h .ld { font-weight:400; font-size:13px; color:var(--link); }
  .leader-block { display:flex; flex-direction:column; gap:6px; }
  .lb-t { font-weight:700; font-size:13px; color:var(--title); display:flex; align-items:center; gap:6px; }
  .lc { color:var(--tx2); }
  .bc { display:inline-block; background:var(--bc-bg, #2b3a5c); border-radius:5px; padding:0 6px; font-size:11px; color:#fff; font-weight:600; margin-right:2px; }
  .surge { display:flex; flex-direction:column; gap:1px; padding:7px 9px; background:var(--inset); border:1px solid var(--line3); border-left:3px solid var(--warn); border-radius:6px; }
  .surge .s-top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .surge .s-name { font-weight:600; color:var(--title); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .surge .s-amt { color:var(--pos); font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .surge .s-amt .pct { color:var(--warn-txt); font-weight:600; margin-left:6px; }
  .surge .s-meta { color:var(--tx3); font-size:12px; }
  .surge .s-why { color:var(--warn-txt); font-size:12px; margin-top:2px; }
  .brief-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .brief-title { font-size:15px; font-weight:700; margin-bottom:10px; color:var(--title); display:flex; align-items:center; gap:7px; }
  .brief-date { font-size:13px; color:var(--link); font-weight:700; }
  .brief-date .big { font-size:15px; }
  .brief-grid { font-size:13px; display:flex; flex-direction:column; gap:5px; }
  .brief-row { display:flex; justify-content:space-between; gap:10px; }
  .brief-row .n { color:var(--tx3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brief-row .c { color:var(--pos); font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .brief-row .leader-name { color:var(--tx); font-weight:600; }
  .brief-row .leader-note { color:var(--tx4); font-weight:400; font-size:12px; }
  .brief-tagline { color:var(--tx3); font-size:12px; margin-top:8px; }
  .brief-new { display:flex; flex-wrap:wrap; gap:6px; }
  .brief-new .gname { background:var(--bg2); color:var(--tx); border:1px solid var(--line); border-radius:6px;
                       padding:2px 8px; font-size:12px; }
  .brief-new .gname[data-title] { cursor:pointer; }
  .brief-new .gname[data-title]:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .brief-new .plat { color:var(--warn); font-weight:600; font-size:12px; }
  .brief-new .empty-t { color:var(--tx4); font-size:12px; }
  .gain-block { margin-bottom:6px; }
  .gain-cards { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .gain-card { min-width:150px; max-width:200px; background:var(--bg2); border:1px solid var(--line);
                border-radius:8px; padding:8px 10px; cursor:pointer; flex:0 0 auto; }
  .gain-card:hover { background:var(--bg3); border-color:var(--accent); }
  .gain-card .gt { font-size:12.5px; color:var(--tx); font-weight:600; white-space:nowrap;
                    overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
  .gain-card .gv { font-size:13px; color:var(--tx3); font-variant-numeric:tabular-nums; }
  .gain-card .gd { font-size:12.5px; font-weight:600; }
  .gain-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  .gain-tbl th { text-align:left; color:var(--warn); font-weight:700; border-bottom:1px solid var(--line); padding:6px 8px; font-size:12.5px; }
  .gain-tbl td { padding:5px 8px; border-bottom:1px solid var(--line4); vertical-align:top; }
  .gain-tbl td.rk { color:var(--na); width:56px; }
  .gain-tbl td.gc { cursor:pointer; }
  .gain-tbl td.gc:hover { background:var(--bg3); }
  .gain-tbl .gt { color:var(--tx); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .gain-tbl .gco { color:var(--tx5); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; margin-top:1px; }
  .gain-tbl .gl { display:flex; gap:8px; margin-top:2px; white-space:nowrap; }
  .gain-tbl .gv { color:var(--tx3); }
  .gain-tbl .gd { font-weight:600; }
  @keyframes flashbg { 0%,100% { background:transparent; } 25%,70% { background:var(--accent); } }
  tr.flash { animation:flashbg 2.5s ease; }

</style>
</head>
<body>
<!-- 今日简报：第一眼必须是它，置于页面最前 -->
<div class="brief" id="brief"></div>

<!-- 精简页头（数据说明）+ 主题入口(挪右下悬浮) -->
<div class="masthead"><span class="mh-title">🎮 游戏预约榜</span><span class="mh-sub">数据 · 2026-09-12 · 切换平台Tab</span></div>

<div class="tabs" id="platTabs"></div>

<div class="filters">
  <input class="search" id="search" placeholder="🔍 搜游戏名/厂商...">
  <div class="new-btn" id="newBtn" title="只看今日新增上榜">🆕 今日新增</div>
  <div class="new-btn on" id="top20Btn" title="点亮=只看榜单前20；点灭=看全量">🏆 仅看 Top20</div>
</div>

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(v){
  if(v===null||v===undefined) return '-';
  v=Number(v);
  if(v>=1e8) return (v/1e8).toFixed(2)+'亿';
  if(v>=1e4) return (v/1e4).toFixed(1)+'万';
  return String(Math.round(v));
}
function fmtDelta(x){
  if(x===null||x===undefined) return '-';
  x=Number(x);
  if(x>0) return '+'+fmt(x);
  if(x<0) return fmt(x);
  return '0';
}
function deltaClass(x){ return x>0?'pos':(x<0?'neg':'zero'); }

function companyOf(it){
  return (it.company_full||it.company||it.operator||it.developer||'').toLowerCase();
}
// 厂商名是否命中某大厂标签(含别名)
function matchTagName(nameP, tag){
  const n = String(nameP||'').toLowerCase();
  const t = String(tag).toLowerCase();
  const aliases = (COMPANY_ALIAS[tag]||[tag]).map(a=>String(a).toLowerCase());
  return aliases.some(a=> n.includes(a));
}
// 给定一条记录，返回命中的大厂标签数组(BUILTIN_TAGS 顺序优先, 也匹配自定义标签)
function bigTagsOf(it){ const r=[]; BUILTIN_TAGS.forEach(tag=>{ if(matchTagName(companyOf(it), tag)) r.push(tag); }); return r; }
function matchesTag(it, tag){
  const n = (it.company_full||it.company||it.operator||it.developer||'').toLowerCase();
  // 1) 标签本身/别名在厂商名中; 2) 反向: 厂商名含于标签(如标签=公司主体全称)
  const t = String(tag).toLowerCase();
  if(n.includes(t)) return true;
  const aliases = (COMPANY_ALIAS[tag]||[tag]).map(a=>String(a).toLowerCase());
  return aliases.some(a=> n.includes(a));
}

  b.innerHTML = `

      <div class="brief-title">🆕 今日新游明细（${newTotal}款，点击定位）</div>

  b.querySelectorAll('.new-tbl td.gc, table td.gc').forEach(el=>{
    if(el.dataset?.title) el.onclick = ()=>jumpToGame(el.dataset.plat, el.dataset.title);

function testCard(){
  var G = (TESTGANT && TESTGANT.days) ? TESTGANT : null;
  if (!G || !G.days || !G.days.length) return '<span class="empty-t">近期暂无已排期节点</span>';
  var days = G.days, N = days.length, DW = 46, LEFT = 172, ROWH = 66, TOP = 30;
  var todayI = days.indexOf(G.today);
  function toIdx(d){ return days.indexOf(d); }
  function xOf(i){ return i * DW; }
  function mid(i){ return i * DW + DW / 2; }
  function md(d){ if (!d) return ''; var p = d.split('-'); return (+p[1]) + '/' + (+p[2]); }
  function fmtv(v){ if (v == null) return ''; if (v >= 1e8) return (v/1e8).toFixed(1)+'亿'; if (v >= 1e4) return (v/1e4).toFixed(1)+'万'; return '' + Math.round(v); }

  // 排序: 今日 start 最前, 其余按预约量降序
  var list = (G.games || []).filter(function(g){ return g.start || g.end || g.testdate || (g.nodes && g.nodes.length); });
  list.sort(function(a, b){
    var at = (a.start && a.start === G.today) ? 1 : 0;
    var bt = (b.start && b.start === G.today) ? 1 : 0;
    if (bt !== at) return bt - at;
    return (b.reserve || 0) - (a.reserve || 0);
  });

  // ---------- 表头日轴 ----------
  var hdr = '';
  for (var i = 0; i < N; i++){
    var tk = (i === todayI);
    hdr += '<div style="text-align:center;width:'+DW+'px;flex:0 0 '+DW+'px;box-sizing:border-box">'
        + '<div style="height:16px;line-height:16px;font-size:'+(tk?11:9.5)+'px;color:'+(tk?'var(--warn)':'var(--tx3)')+';font-weight:'+(tk?'800':'500')+'">'+(tk?'今天':md(days[i]))+'</div>'
        + '<div style="position:relative;height:14px">'
        + '<div style="position:absolute;left:0;right:0;top:6px;height:1px;background:'+(tk?'var(--warn)':'var(--line3)')+'"></div>'
        + '<div style="position:absolute;left:'+(DW/2-4)+'px;top:2px;width:7px;height:7px;border-radius:50%;background:'+(tk?'var(--warn)':'var(--tx4)')+'"></div>'
        + '</div></div>';
  }
  var headerHtml = '<div style="display:flex;border-bottom:1px solid var(--line)">'
    + '<div style="position:sticky;left:0;z-index:15;width:'+LEFT+'px;flex:0 0 '+LEFT+'px;background:var(--bg3);box-sizing:border-box;padding:2px 8px;color:var(--tx4);font-size:11px;border-right:1px solid var(--line);line-height:1.3">测试/招募 排期<br><span style="font-size:8.5px;color:var(--tx5)">← 左右滑更多日期</span></div>'
    + '<div style="display:flex;width:'+(DW*N)+'px">'+hdr+'</div></div>';

  // ---------- 单行 ----------
  function dot(x, ytop, color, r){ return '<div style="position:absolute;left:'+x+'px;top:'+ytop+'px;width:'+r+'px;height:'+r+'px;border-radius:50%;background:'+color+';border:2px solid var(--bg);z-index:5"></div>'; }
  function label(x, ytop, txt, color, bold){
    return '<div style="position:absolute;left:'+x+'px;top:'+ytop+'px;transform:translateX(-50%);color:'+color+';font-size:'+(bold?9:8.5)+'px;font-weight:'+(bold?700:400)+';white-space:nowrap;text-align:center;line-height:1.15">'+txt+'</div>';
  }
  function barh(g){
    var b='';
    if (todayI>=0) b += '<div style="position:absolute;left:'+(mid(todayI)-1)+'px;top:0;width:2px;height:100%;background:rgba(245,158,11,.3);z-index:1"></div>';
    var si = g.start ? toIdx(g.start) : -1;
    var ei = g.end ? toIdx(g.end) : -1;
    var ti = g.testdate ? toIdx(g.testdate) : -1;

    // 招募条(有 start)
    if (si>=0){
      var x0 = xOf(si);
      var rEndIdx = ei>=0 ? ei : (ti>=0 ? ti : N-1);
      if (rEndIdx < si) rEndIdx = si+1;
      var x1 = xOf(rEndIdx+1);
      if (x1 > x0){
        var open = (ei<0 && ti<0);
        b += '<div style="position:absolute;left:'+x0+'px;top:'+(TOP-1)+'px;width:'+(x1-x0)+'px;height:7px;border-radius:4px;background:'+(open?'var(--bar2,var(--accent))':'var(--bar,var(--accent))')+';z-index:2"></div>';
        // 左端：招募报名开始
        b += dot(x0-6, TOP-6, 'var(--accent)', 12);
        b += label(x0, TOP+3, md(g.start)+'<br><b>招募报名开始</b>', 'var(--accent)', false);
        // 右端：截止 / 开测 / 进行中
        if (ei>=0){ b += dot(x1-6, TOP-6, 'var(--neg)', 12); b += label(x1, TOP+3, md(g.end)+'<br><b>招募截止</b>', 'var(--neg)', false); }
        else if (ti>=0){ b += dot(x1-6, TOP-6, 'var(--warn)', 12); b += label(x1, TOP+3, md(g.testdate)+'<br><b>测试开测</b>', 'var(--warn)', false); }
        else { b += label(x1, TOP+3, '<b>进行中</b>', 'var(--tx4)', false); }
      }
    }
    // 额外动作点(非端点列)
    (g.nodes||[]).forEach(function(n){
      var i = toIdx(n.d); if (i<0) return;
      if (si>=0 && (i===si)) return;           // 起点已画
      if (ei>=0 && (i===ei)) return;           // 招募截止点已画(作为右端)
      if (ti>=0 && (i===ti) && ei<0) return;   // 开测已作为右端
      var acts = n.act.join('/');
      var col = /截止/.test(acts) ? 'var(--neg)' : (/上线/.test(acts) ? 'var(--pos)' : 'var(--warn)');
      var m = mid(i);
      var txt = acts.replace('预下载','预下载').replace('正式上线','正式上线').replace('删档测试','删档测试').replace('招募截止','招募截止');
      b += dot(m-6, TOP-2, col, 12);
      b += label(m, TOP-14, esc(txt), col, true);
      b += label(m, TOP+10, md(n.d), col, false);
    });
    return b;
  }

  function row(g){
    var nm = esc(g.name||'');
    var plat = g.plat||'', dbt = g.dbtitle||'', jump = !!(plat && dbt);
    var side = '<div style="position:sticky;left:0;z-index:9;width:'+LEFT+'px;flex:0 0 '+LEFT+'px;background:var(--bg2);box-sizing:border-box;padding:0 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center">'
      + (jump
         ? '<span onclick="locateTest(this)" data-gp="'+esc(plat)+'" data-gt="'+esc(dbt)+'" title="点我→定位详情" style="cursor:pointer;color:var(--tx);font-size:12.5px;font-weight:700">'+nm+' ⇣</span>'
         : '<b style="color:var(--tx2);font-size:12px">'+nm+'</b>')
      + '<span style="font-size:10px;color:var(--accent)">预约 '+fmtv(g.reserve)+'</span>'
      + '</div>';
    var track = '<div style="position:relative;width:'+(DW*N)+'px;flex:0 0 '+(DW*N)+'px;height:'+ROWH+'px">' + barh(g) + '</div>';
    return '<div style="display:flex;border-top:1px solid var(--line3)">' + side + track + '</div>';
  }

  var SHOW = 5;
  var card = '<div style="border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden">';
  // --- 横向可滚区(只含表头+行) ---
  card += '<div style="overflow-x:auto;max-width:100%">';
  card += '<div style="width:'+(LEFT+DW*N)+'px;min-width:100%">';
  card += headerHtml;
  var showArr = list.slice(0, SHOW);
  var moreArr = list.slice(SHOW);
  for (var a=0;a<showArr.length;a++) card += row(showArr[a]);
  if (moreArr.length){
    card += '<div id="gantExtra" style="display:none">';
    for (var c=0;c<moreArr.length;c++) card += row(moreArr[c]);
    card += '</div>';
  }
  card += '</div>';   // close inner-width (scrolls)
  card += '</div>';   // close scroller
  // --- 展开/收起按钮: 放在滚动区外面, 不随横向滚动移动, 固定 ---
  if (moreArr.length){
    card += '<div style="padding:6px;border-top:1px solid var(--line2);text-align:center;background:var(--card)">'
      + '<span id="gantToggle" onclick="toggleGant()" style="cursor:pointer;color:var(--accent);font-size:12px">▾ 展开共 '+list.length+' 款(更多 »)</span></div>';
  }
  card += '</div>';   // close outer card box
  card += '<div class="brief-tagline">蓝条=开放报名期 → 左端“招募报名开始” · 红点右端“招募截止” · 橙点“开测/删档/限量” · 天蓝=预下载 · 绿=正式上线 · 今天=金竖线 ｜ 点游戏名⇣定位 ｜ 左右滑看完整日期</div>';
  return card;
}
// 展开/收起更多
function toggleGant(){
  var ex = document.getElementById('gantExtra');
  var tg = document.getElementById('gantToggle');
  if (!ex || !tg) return;
  if (ex.style.display === 'none'){ ex.style.display=''; tg.innerHTML='▴ 收起（只显示重点几款）'; }
  else { ex.style.display='none'; tg.innerHTML='▾ 展开全部'; }
}
    
function jumpToGame(plat, title){
  // 1. 切换平台Tab
  curPlat = plat;
  renderTabs();
  // 2. 清筛选, 确保该游戏可见
  if(selectedTags.length) selectedTags=[];
  if(onlyNew){ onlyNew=false; document.getElementById('newBtn').classList.remove('on'); }
  if(onlyTop20){ onlyTop20=false; document.getElementById('top20Btn').classList.remove('on'); }
  keyword='';
  document.getElementById('search').value='';
  sortKey=null; sortDir=1;
  renderTagbar();
  renderGrid();
  // 3. 找到该游戏行并滚动高亮(同步, renderGrid已更新DOM)
  const rows = document.querySelectorAll('#gridBody tr');
  let target = null;
  rows.forEach(r=>{ if(r.textContent.includes(title)) target=r; });
  if(target){
    target.classList.add('flash');
    setTimeout(()=>target.classList.remove('flash'), 2500);
    try{ target.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
  }
}

function renderTabs(){
  const t = document.getElementById('platTabs');
  t.innerHTML = PLATFORMS.map(p=>
    `<div class="tab ${p===curPlat?'active':''}" data-p="${p}">${p}<span class="badge-c">${DATA.all[p]?DATA.all[p].length:0}</span></div>`
  ).join('');
  t.querySelectorAll('.tab').forEach(el=>{
    el.onclick=()=>{ curPlat=el.dataset.p; renderTabs(); renderTagbar(); renderGrid(); };
  });
}

function renderTagbar(){
  const items = DATA.all[curPlat]||[];
  // 内置标签(未删除的) + 自定义标签, 各带当前平台匹配数
  const builtin = BUILTIN_TAGS.filter(t=>!removedBuiltin.includes(t));
  const allTags = [
    ...builtin.map(t=>({name:t, custom:false})),
    ...customTags.map(t=>({name:t, custom:true}))
  ];
  const bar = document.getElementById('tagbar');
  const filterTags = allTags.map(t=>{
      const n = items.filter(it=>matchesTag(it,t.name)).length;
      const on = selectedTags.includes(t.name);
      const cls = ['tag', t.custom?'tag-custom':'', on?'on':''].join(' ').trim();
      return `<div class="${cls}" data-tag="${esc(t.name)}">${esc(t.name)}<span class="badge-c">${n}</span><span class="x" data-x="${esc(t.name)}" title="从筛选移除">×</span></div>`;
    }).join('');
  const blockTagsHtml = blockedTags.map(w=>
        `<span class="tag tag-block" title="已屏蔽该厂商">${esc(w)}<span class="bx" data-bx="${esc(w)}" title="解除屏蔽">×</span></span>`).join('');
  bar.innerHTML =
    `<div class="tgrp"><span class="tgrp-l">筛选</span>${filterTags}<div class="tag-add" id="tagAdd" title="添加筛选标签">＋</div></div>`
    + `<div class="tgrp tgrp-red"><span class="tgrp-l">屏蔽</span>${blockTagsHtml}<div class="tag-add tag-add-block" id="tagAddBlock" title="屏蔽某厂商(红, 其游戏全部隐藏)">＋</div></div>`;
  // 筛选标签多选切换
  bar.querySelectorAll('.tag:not(.tag-block)').forEach(el=>{
    el.onclick=(e)=>{
      if(e.target.classList.contains('x')) return;
      const t=el.dataset.tag;
      if(selectedTags.includes(t)) selectedTags=selectedTags.filter(x=>x!==t); else selectedTags.push(t);
      renderTagbar(); renderGrid();
    };
  });
  // 屏蔽标签解除
  bar.querySelectorAll('.bx').forEach(bx=>{
    bx.onclick=(e)=>{ e.stopPropagation(); const w=bx.dataset.bx; unblockTag(w); };
  });
  // 屏蔽加号
  const ab = document.getElementById('tagAddBlock');
  if(ab) ab.onclick = ()=>addTagBlock();
  // 标签删除(小叉)
  bar.querySelectorAll('.x').forEach(x=>{
    x.onclick=(e)=>{
      e.stopPropagation();
      const t = x.dataset.x;
      // 从自定义或内置中移除
      if(customTags.includes(t)) customTags = customTags.filter(y=>y!==t);
      else if(!removedBuiltin.includes(t)) removedBuiltin.push(t);
      selectedTags = selectedTags.filter(y=>y!==t);
      renderTagbar(); renderGrid();
    };
  });
  // 加号按钮
  const addBtn = document.getElementById('tagAdd');
  addBtn.onclick = ()=>addCustomTag();
}

function showInputDialog(title){
  return prompt(title, '');
}

function addCustomTag(){
  const tag = showInputDialog('输入厂商标签(如: 冰川)');
  if(!tag || !tag.trim()) return;
  const name = tag.trim();
  // 去重: 已存在则仅选中, 不重复添加
  if(customTags.includes(name) || BUILTIN_TAGS.includes(name)){
    if(!selectedTags.includes(name)) selectedTags.push(name);
    renderTagbar(); renderGrid();
    return;
  }
  customTags.push(name);
  selectedTags.push(name);
  renderTagbar(); renderGrid();
}

function addTagBlock(){
  const w=prompt('输入要屏蔽(隐藏)的厂商名或关键词，如：创巴；该厂商的游戏将全部隐藏，支持模糊匹配');
  if(!w || !w.trim()) return;
  blockedTags.push(w.trim());
  renderTagbar(); renderGrid();
}
function blockMatches(it){
  const s=companyOf(it);
  return blockedTags.some(w=> w && s.includes(w.toLowerCase()));
}
function unblockTag(w){
  blockedTags=blockedTags.filter(x=>x!==w);
  renderTagbar(); renderGrid();
}

function getSortVal(it, key){  if(key==='reserve') return (it.reserve==null? -Infinity : it.reserve);
  if(key==='rank') return it.rank;
  const g=(DATA.growth[curPlat]||{})[it.title]||{};
  const v = g[key]?g[key].delta:null;
  return (v==null? -Infinity : v);
}

function sortRows(rows){
  if(!sortKey || sortKey==='rank'){
    if(sortKey==='rank') rows.sort((a,b)=>sortDir*(a.rank-b.rank));
    return rows;
  }
  rows.sort((a,b)=>{
    const av=getSortVal(a,sortKey), bv=getSortVal(b,sortKey);
    return sortDir*(av-bv);
  });
  return rows;
}

function coDev(it){ // 取"主厂商/供应商"串: 有开发商用开发商; TapTap无dev则用法人全称(company_full), 再退简称
  if(it.developer!=null && String(it.developer).trim()) return String(it.developer).trim();
  const cf=(it.company_full||'').trim();
  const cs=(it.company||'').trim();
  // 全称优先(能看出是哪家公司/供应商), 简称仅兜底
  return (cf||cs);
}
function coLine(it){ // 展示用: 厂商/供应商 + 发行 两段。全称优先, 能认出是哪家
  const dev=coDev(it);
  const op=(it.operator?String(it.operator):'').trim();
  const same=(op && op===dev);
  let lines=[];
  if(dev) lines.push(dev);
  if(op && !same) lines.push('发行：'+op);
  if(lines.length===0) return '<td>-</td>';
  if(lines.length===1) return `<td>${esc(lines[0])}</td>`;
  // 两行: 主 + 发行
  return `<td>${esc(lines[0])}<div class="co-sub">${esc(lines[1])}</div></td>`;
}
function coPlain(it){ // 纯文本(供搜索/匹配)
  const dev=coDev(it);
  const op=(it.operator?String(it.operator):'').trim();
  return (dev+' '+(op&&op!==dev?op:'')).trim()||'-';
}
function coShort(it){ // 窄格卡片用: 返回单个最优公司串(中文优先)
  const cand=[it.operator, it.developer, it.company_full, it.company].map(v=>v?String(v).trim():'').filter(Boolean);
  if(!cand.length) return '-';
  const hasCN=/[一-鿿]/;
  const zh=cand.find(v=>hasCN.test(v));
  return zh||cand[0];
}

function renderGrid(){
  const items = DATA.all[curPlat]||[];
  const numLabel = curPlat==='B站游戏' ? '已预约' : (curPlat==='TapTap新品' ? '下载/上市' : '预约量');
  // 筛选
  let rows = items.slice();
  if(onlyTop20) rows = rows.filter(it=>it.rank!=null && it.rank<=20);
  if(onlyNew) rows = rows.filter(it=>it.is_new);
  if(selectedTags.length>0){
    // 多标签 = 并集(命中任一标签)
    rows = rows.filter(it=>selectedTags.some(tag=>matchesTag(it,tag)));
  }
  if(keyword){
    const k=keyword;
    rows = rows.filter(it=> (it.title||'').toLowerCase().includes(k) ||
      companyOf(it).includes(k));
  }
  // 屏蔽(排除)优先：命中屏蔽词的厂商游戏硬性隐藏
  if(blockedTags.length>0){
    rows = rows.filter(it=>!blockMatches(it));
  }
  rows = sortRows(rows);
  document.getElementById('meta').textContent =
    `显示 ${rows.length} / ${items.length} 款（${onlyTop20?'Top20':'全部'}${onlyNew?'、今日新增':''}）｜ ${curPlat}${selectedTags.length?(' ｜ 标签: '+selectedTags.join('+')):''}${blockedTags.length?(' ｜ 🚫屏蔽 '+blockedTags.join('、')):''}`;

  const cols = [
    {k:'rank',  label:'排名'},{k:null, label:'游戏'},{k:null, label:'厂商/发行'},
    {k:'reserve', label:numLabel},{k:'daily', label:'+昨日'},
    {k:'weekly', label:'+7日'},{k:'monthly', label:'+30日'},
    {k:null, label:'评分'},{k:null, label:'详情'},
  ];
  document.getElementById('gridHead').innerHTML = cols.map(c=>{
    if(!c.k) return `<th>${esc(c.label)}</th>`;
    const sortable = ['reserve','daily','weekly','monthly','rank'].includes(c.k);
    if(!sortable) return `<th class="num">${esc(c.label)}</th>`;
    let arrow='', cls='num sortable';
    if(sortKey===c.k){ arrow = sortDir===1?' ▲':' ▼'; cls+=' sorted'; }
    return `<th class="${cls}" data-k="${c.k}" style="cursor:pointer" title="点我按${esc(c.label)}排序，再点切换升/降">${esc(c.label)}${arrow}</th>`;
  }).join('');

  document.querySelectorAll('#gridHead th.sortable').forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.k;
      if(sortKey===k){ if(sortDir===1) sortDir=-1; else { sortKey=null; sortDir=1; } }
      else { sortKey=k; sortDir=1; }
      renderGrid();
    };
  });

  if(!rows.length){
    document.getElementById('gridBody').innerHTML='<tr><td colspan="9" class="empty">无匹配</td></tr>';
    return;
  }
  document.getElementById('gridBody').innerHTML = rows.map(it=>{
    // 详情跳转: 有link直接用; TapTap只有app_id无link -> 拼标准详情页 https://www.taptap.cn/app/<id>
    let hl = it.link || (((curPlat||'').indexOf('TapTap')===0 && it.app_id) ? ('https://www.taptap.cn/app/'+it.app_id) : '');
    let linkTd = hl ? `<td><a class="link" href="${esc(hl)}" target="_blank">查看 ↗</a></td>` : '<td>-</td>';
    const g = (DATA.growth[curPlat]||{})[it.title]||{};
    const arrow = (v)=>{
      if(v===null||v===undefined) return '-';
      if(v>0) return '▲ '+fmtDelta(v);
      if(v<0) return '▼ '+fmtDelta(v);
      return '0';
    };
    const body = `<td>${it.rank}</td>
      <td>${it.is_new?'<span class="new-badge">新</span>':''}${esc(it.title)}</td>` + coLine(it) +
      `<td class="num">${fmt(it.reserve)}</td>` +
      `<td class="num ${deltaClass(g.daily?g.daily.delta:null)}">${arrow(g.daily?g.daily.delta:null)}</td>
       <td class="num ${deltaClass(g.weekly?g.weekly.delta:null)}">${arrow(g.weekly?g.weekly.delta:null)}</td>
       <td class="num ${deltaClass(g.monthly?g.monthly.delta:null)}">${arrow(g.monthly?g.monthly.delta:null)}</td>` +
      `<td class="num">${esc(it.score||'-')}</td>${linkTd}`;
    return `<tr>${body}</tr>`;
  }).join('');
}

const s = document.getElementById('search');
s.oninput = ()=>{ keyword=s.value.trim().toLowerCase(); renderGrid(); };
const newBtn = document.getElementById('newBtn');
newBtn.onclick = ()=>{ onlyNew=!onlyNew; newBtn.classList.toggle('on',onlyNew); renderGrid(); };

// ===== 主题切换器 =====
const THEMES = [
  {key:'deep',   name:'🔵 星穹深蓝', dot:'#1c2333'},
  {key:'paper',  name:'🟡 暖纸米白', dot:'#e6ddd0'},
  {key:'graphite',name:'⚫ 霓虹石墨', dot:'#2fd4c0'},
];
function applyTheme(key){
  document.body.classList.remove('theme-paper','theme-graphite');
  if(key && key!=='deep') document.body.classList.add('theme-'+key);
  const meta = THEMES.find(t=>t.key===key)||THEMES[0];
  const nm = document.getElementById('themeName');
  if(nm) nm.textContent = meta.name;
  try{ localStorage.setItem('dashTheme', key||'deep'); }catch(e){}
}
(function initThemeMenu(){
  let saved='deep'; try{ saved = localStorage.getItem('dashTheme')||'deep'; }catch(e){}
  applyTheme(saved);
  const sw = document.getElementById('themeSwitch');
  const menu = document.createElement('div');
  menu.className = 'theme-menu';
  menu.innerHTML = THEMES.map(t=>`<div class="tm-item" data-k="${t.key}"><span class="dot" style="background:${t.dot}"></span>${t.name}</div>`).join('');
  sw.appendChild(menu);
  sw.addEventListener('click', (e)=>e.stopPropagation());
  sw.onclick = (e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
  menu.querySelectorAll('.tm-item').forEach(it=>{
    it.onclick = (e)=>{ e.stopPropagation(); applyTheme(it.dataset.k); menu.classList.remove('open'); };
  });
  document.addEventListener('click', ()=>menu.classList.remove('open'));
})();
</script>
